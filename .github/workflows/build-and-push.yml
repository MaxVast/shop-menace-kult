name: build and push images

on:
  push:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: ${{ github.repository_owner }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: set lower case IMAGE_NAMESPACE name
        run: |
            echo "IMAGE_NAMESPACE_LC=${IMAGE_NAMESPACE,,}" >>${GITHUB_ENV}

      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push php-fpm image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile
          target: php_fpm
          build-args: |
            APP_ENV=prod
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE_LC }}/shop-menace-kult-php-fpm:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE_LC }}/shop-menace-kult-php-fpm:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push nginx image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile
          target: nginx
          build-args: |
            APP_ENV=prod
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE_LC }}/shop-menace-kult-nginx:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE_LC }}/shop-menace-kult-nginx:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
      needs: build-and-push
      runs-on: ubuntu-latest
      permissions:
          contents: read
      env:
          GKE_CLUSTER: shop-menace-kult-cluster
          GKE_ZONE: europe-west1-b

      steps:
          -   name: Checkout
              uses: actions/checkout@v4

          -   name: Authenticate to GCP
              uses: google-github-actions/auth@v2
              with:
                  credentials_json: ${{ secrets.GCP_SA_KEY }}

          -   name: Set up gcloud CLI
              uses: google-github-actions/setup-gcloud@v2

          -   name: Install gke-gcloud-auth-plugin
              run: gcloud components install gke-gcloud-auth-plugin --quiet

          -   name: Get GKE credentials
              uses: google-github-actions/get-gke-credentials@v2
              with:
                  cluster_name: ${{ env.GKE_CLUSTER }}
                  location: ${{ env.GKE_ZONE }}

          -   name: Set up Helm
              uses: azure/setup-helm@v4

          -   name: Deploy with Helm
              run: |
                  helm upgrade --install shop-menace-kult ./k8s/shop-menace-kult \
                    --set phpFpm.image.tag=${{ github.sha }} \
                    --set nginx.image.tag=${{ github.sha }}

          -   name: Run database migrations
              run: |
                  kubectl rollout status deployment/shop-menace-kult-php-fpm --timeout=120s
                  kubectl exec deployment/shop-menace-kult-php-fpm -- php bin/console doctrine:migrations:migrate --no-interaction

name: build and push images

on:
  push:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: ${{ github.repository_owner }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push php-fpm image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile
          target: php_fpm
          build-args: |
            APP_ENV=prod
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/shop-menace-kult-php-fpm:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/shop-menace-kult-php-fpm:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push nginx image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile
          target: nginx
          build-args: |
            APP_ENV=prod
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/shop-menace-kult-nginx:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/shop-menace-kult-nginx:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

name: validate k8s config

on:
  pull_request:
    branches:
      - develop

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Helm
        uses: azure/setup-helm@v5

      - name: Helm lint
        run: helm lint --strict ./k8s/shop-menace-kult

      - name: Install kubeconform
        run: |
          curl -L https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz | tar xz
          sudo mv kubeconform /usr/local/bin/

      - name: Render and validate manifests with kubeconform
        run: |
          helm template shop-menace-kult ./k8s/shop-menace-kult | kubeconform -strict -summary

      - name: Create kind cluster
        uses: helm/kind-action@v1

      - name: Deploy to kind (structural smoke test)
        run: |
          kubectl create secret generic postgres-credentials \
            --from-literal=POSTGRES_DB=test \
            --from-literal=POSTGRES_USER=test \
            --from-literal=POSTGRES_PASSWORD=test
          helm install shop-menace-kult ./k8s/shop-menace-kult \
            --set phpFpm.image.repository=nginx \
            --set phpFpm.image.tag=alpine \
            --set nginx.image.repository=nginx \
            --set nginx.image.tag=alpine \
            --wait --timeout=60s

  minikube-integration-test:
    needs: lint-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Start minikube
        uses: medyagh/setup-minikube@latest
        with:
          driver: docker

      - name: Set up Helm
        uses: azure/setup-helm@v5

      - name: Build images inside minikube's docker env
        run: |
          eval $(minikube docker-env)
          docker build -f docker/Dockerfile --target php_fpm --build-arg APP_ENV=prod -t shop-menace-kult-php-fpm:ci .
          docker build -f docker/Dockerfile --target nginx --build-arg APP_ENV=prod -t shop-menace-kult-nginx:ci .

      - name: Deploy Postgres
        run: |
          kubectl create secret generic postgres-credentials \
            --from-literal=POSTGRES_DB=shop \
            --from-literal=POSTGRES_USER=shop \
            --from-literal=POSTGRES_PASSWORD=shop
          kubectl apply -f k8s/database/postgres.yaml
          kubectl rollout status deployment/postgres --timeout=90s

      - name: Deploy application chart
        run: |
          eval $(minikube docker-env)
          helm install shop-menace-kult ./k8s/shop-menace-kult \
            --set phpFpm.image.repository=shop-menace-kult-php-fpm \
            --set phpFpm.image.tag=ci \
            --set phpFpm.image.pullPolicy=Never \
            --set nginx.image.repository=shop-menace-kult-nginx \
            --set nginx.image.tag=ci \
            --set nginx.image.pullPolicy=Never

      - name: Wait for pods to be ready
        run: |
          kubectl rollout status deployment/shop-menace-kult-php-fpm --timeout=90s || {
            kubectl describe pod -l app=shop-menace-kult-php-fpm
            kubectl logs -l app=shop-menace-kult-php-fpm
            exit 1
          }
          kubectl rollout status deployment/shop-menace-kult-nginx --timeout=90s || {
            kubectl describe pod -l app=shop-menace-kult-nginx
            kubectl logs -l app=shop-menace-kult-nginx
            exit 1
          }

      - name: Run database migrations
        run: |
          kubectl exec deployment/shop-menace-kult-php-fpm -- php bin/console doctrine:migrations:migrate --no-interaction

      - name: Check application health
        run: |
          kubectl port-forward service/shop-menace-kult-nginx 8443:443 &
          sleep 5
          HTTP_CODE=$(curl -sk -o /dev/null -w '%{http_code}' -H "Host: prod.shop-menace-kult.fr" https://localhost:8443/health-check)
          if [ "$HTTP_CODE" = "200" ]; then
            exit 0
          fi
          echo "Health check failed with HTTP $HTTP_CODE"
          kubectl logs deployment/shop-menace-kult-nginx
          kubectl logs deployment/shop-menace-kult-php-fpm
          exit 1

      - name: Check application homepage
        run: |
            kubectl port-forward service/shop-menace-kult-nginx 8443:443 &
            sleep 5
            HTTP_CODE=$(curl -sk -o /dev/null -w '%{http_code}' -H "Host: prod.shop-menace-kult.fr" https://localhost:8443/)
            if [ "$HTTP_CODE" = "200" ]; then
              exit 0
            fi
            echo "Health check failed with HTTP $HTTP_CODE"
            kubectl logs deployment/shop-menace-kult-nginx
            kubectl logs deployment/shop-menace-kult-php-fpm
            exit 1

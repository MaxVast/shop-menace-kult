apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-php-fpm
  labels:
    app: {{ .Release.Name }}-php-fpm
spec:
  replicas: {{ .Values.phpFpm.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}-php-fpm
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-php-fpm
    spec:
      imagePullSecrets:
        {{- toYaml .Values.imagePullSecrets | nindent 8 }}
      containers:
        - name: php-fpm
          image: "{{ .Values.phpFpm.image.repository }}:{{ .Values.phpFpm.image.tag }}"
          imagePullPolicy: {{ .Values.phpFpm.image.pullPolicy }}
          ports:
            - containerPort: 9000
          env:
            - name: APP_ENV
              value: {{ .Values.phpFpm.env.APP_ENV | quote }}
            - name: APP_DEBUG
              value: {{ .Values.phpFpm.env.APP_DEBUG | quote }}
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_PASSWORD
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_DB
            - name: DATABASE_URL
              value: "postgresql://$(DB_USER):$(DB_PASSWORD)@postgres:5432/$(DB_NAME)?serverVersion=13&charset=utf8"
          resources:
            {{- toYaml .Values.phpFpm.resources | nindent 12 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-nginx
  labels:
    app: {{ .Release.Name }}-nginx
spec:
  replicas: {{ .Values.nginx.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}-nginx
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-nginx
    spec:
      imagePullSecrets:
        {{- toYaml .Values.imagePullSecrets | nindent 8 }}
      containers:
        - name: nginx
          image: "{{ .Values.nginx.image.repository }}:{{ .Values.nginx.image.tag }}"
          imagePullPolicy: {{ .Values.nginx.image.pullPolicy }}
          ports:
            - containerPort: 80
          env:
            {{- range $key, $value := .Values.nginx.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
          resources:
            {{- toYaml .Values.nginx.resources | nindent 12 }}

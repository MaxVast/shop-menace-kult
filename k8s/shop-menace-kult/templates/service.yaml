apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-php-fpm
spec:
  type: ClusterIP
  selector:
    app: {{ .Release.Name }}-php-fpm
  ports:
    - port: {{ .Values.phpFpm.service.port }}
      targetPort: 9000
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-nginx
spec:
  type: {{ .Values.nginx.service.type }}
  selector:
    app: {{ .Release.Name }}-nginx
  ports:
    - name: http
      port: 80
      targetPort: 80
    - name: https
      port: 443
      targetPort: 443
